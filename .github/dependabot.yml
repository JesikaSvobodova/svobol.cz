version: 2

updates:
  # npm závislosti — jeden souhrnný PR měsíčně, ať to nezahltí review
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Verze GitHub Actions — bezpečnostně důležité, ať nezůstanou zaseklé
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
